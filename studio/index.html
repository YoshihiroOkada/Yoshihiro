<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MV Studio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #141210; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="lib/motion.js"></script>
<script src="build/timeline.js"></script>
<script>
// ?format=16x9|9x16|1x1|animatic  &reduced=1  &final=1
const Q = new URLSearchParams(location.search);
const FORMATS = { '16x9': [1920, 1080], '9x16': [1080, 1920], '1x1': [1080, 1080], 'animatic': [960, 540] };
const [W, H] = FORMATS[Q.get('format') || '16x9'];
const REDUCED = Q.get('reduced') === '1';
const FINAL = Q.get('final') === '1';
const TL = window.TIMELINE, TK = TL.tokens, C = TK.color, M = Motion;
const L = M.layout(W, H, TK);
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

// ---------- 素材（OpenAI で生成した画像だけ。図形で代用しない） ----------
const IMG = {};
for (const [id, a] of Object.entries(TL.assets)) { const im = new Image(); im.src = a.file; IMG[id] = im; }
window.ready = async () => {
  await Promise.all(Object.values(IMG).map(im => im.decode().catch(() => null)));
  await document.fonts.ready;
  await document.fonts.load(`${TK.font.display.weight} 40px "${TK.font.display.family}"`);
  await document.fonts.load(`${TK.font.text.weight} 20px "${TK.font.text.family}"`);
  return { missing: TL.missing, fontsOk: document.fonts.check(`700 40px "${TK.font.display.family}"`) };
};

// 足りない素材: 下書き（アニマティック）では名前だけ文字で示す。本番では描かない（render.mjs が止める）
function drawAsset(id, x, y, w, h, alpha = 1) {
  const im = IMG[id];
  if (im && im.complete && im.naturalWidth) {
    g.globalAlpha = alpha; g.drawImage(im, x, y, w, h); g.globalAlpha = 1;
  } else if (!FINAL) {
    g.globalAlpha = 0.5 * alpha; g.fillStyle = C.muted;
    g.font = `${TK.font.text.weight} ${Math.round(14 * L.unit)}px "${TK.font.text.family}"`;
    g.textAlign = 'center'; g.fillText('[' + id + ']', x + w / 2, y + h / 2); g.globalAlpha = 1;
  }
}
const aspect = id => (TL.assets[id] ? TL.assets[id].w / TL.assets[id].h : 1);

// ---------- 時間で決まる量 ----------
// サビの度合い 0（墓場）→ 1（舞踏会）。切り替えは場面スプリング、動きを抑えた版はカット
// 舞踏会へ上がる動きは、サビ最初の行の前に終わる。戻る動きは、サビ最後の行が消えたあとに始まり、次の行の前に終わる
const TRANS = TK.motion.sceneMove;
function chorusAmount(t) {
  const keys = [[0, 0]];
  for (const [a, b] of TL.chorus) keys.push([a - TRANS, 1], [b - TRANS, 0]);
  if (REDUCED) { let v = 0; for (const [kt, kv] of keys) if (t >= kt + TRANS * 0.5) v = kv; return v; }
  return M.clamp(M.track(t, keys, TK.spring.scene.k, TK.spring.scene.d));
}
// カメラ [横位置（画面幅の割合）, ズーム]。読んでいる間は止まっている
function camera(t) {
  if (REDUCED) { let v = TL.camKeys[0][1]; for (const [kt, kv] of TL.camKeys) if (t >= kt) v = kv; return v; }
  return M.trackVec(t, TL.camKeys, TK.spring.camera.k, TK.spring.camera.d);
}
const sceneAt = t => TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];

// ---------- 世界（2.5D）: 墓場（下）と舞踏会（上）を縦に重ね、サビでカメラが上がる ----------
const UP = H * 1.15;            // 舞踏会の世界は墓場の上
const GROUND = H * 0.82;        // 地面の線（キャプション帯の上）
function drawWorld(t) {
  const [cx, zoom] = camera(t);
  const ch = chorusAmount(t);
  const camY = ch * UP;
  // 背景プレート（遠景・視差小）
  for (const [id, wy] of [['bg_graveyard', 0], ['bg_ballroom', -UP]]) {
    const par = 0.25, s = zoom * 1.08;
    const w = Math.max(W, H * aspect(id)) * s, h = w / aspect(id);
    const x = W / 2 - w / 2 - cx * W * par, y = H / 2 - h / 2 + (wy + camY) * 0.9;
    if (y > H || y + h < 0) continue;
    drawAsset(id, x, y, w, h);
  }
  // 小物（奥行き z: 大きいほど奥・小さく・視差小）
  const sorted = TL.props.slice().sort((a, b) => b.z - a.z);
  for (const p of sorted) {
    const wy = p.section === 'chorus' ? -UP : 0;
    const par = 1.15 - p.z * 0.6, s = (1.25 - p.z * 0.75) * zoom;
    const baseH = { tomb: 0.36, cross: 0.4, tree: 0.85, pumpkin_lit: 0.16, pillar: 0.95, chandelier: 0.32, dancers: 0.5 }[p.id] * H * s;
    const w = baseH * aspect(p.id), h = baseH;
    const x = W / 2 + p.x * W * 0.5 * zoom - cx * W * par - w / 2;
    let y = p.id === 'chandelier' ? H * 0.02 : GROUND + (1 - p.z) * H * 0.06 - h;
    y += wy + camY;
    if (y > H || y + h < 0 || x > W || x + w < 0) continue;
    drawAsset(p.id, x, y, w, h);
  }
  // 物語の中心: 墓の上に置かれた仮面（冒頭と最後の絵）
  {
    const s = zoom, w = W * (L.narrow ? 0.42 : 0.24) * s, h = w / aspect('mask');
    const x = W / 2 + W * (L.narrow ? 0 : 0.2) * zoom - cx * W * 1.0 - w / 2;
    const y = GROUND - h * 0.9 + camY;
    if (y < H) drawAsset('mask', x, y, w, h);
  }
  // 灯: カボチャの灯が昇って、舞踏会の灯になる（物を差し替えずに場所を移す）
  if (ch > 0.001) {
    TL.props.filter(p => p.section === 'verse' && p.id === 'pumpkin_lit').forEach((p, i) => {
      const par = 1.15 - p.z * 0.6, s = (1.25 - p.z * 0.75) * zoom;
      const x0 = W / 2 + p.x * W * 0.5 * zoom - cx * W * par;
      const y0 = GROUND - 0.08 * H * s;                       // カボチャの顔のあたり（墓場の世界）
      const x1 = W * (0.2 + 0.6 * ((i * 0.37) % 1)), y1 = -UP + H * (0.2 + 0.1 * (i % 3)); // 舞踏会の上の方
      const k = M.clamp(ch * 1.15);
      const x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k + camY;
      const size = H * 0.06 * (1 + k * 0.3);
      drawAsset('light', x - size / 2, y - size / 2, size, size, M.clamp(ch / 0.15));
    });
  }
}

// ---------- 文字 ----------
function setFont(kind, px) { g.font = `${TK.font[kind].weight} ${px}px "${TK.font[kind].family}"`; }

function drawKeyword(t, s) {
  if (s.kind !== 'line' || t < s.textIn || t > s.textOut) return;
  const size = Math.round(L.display * (s.emph ? TK.type.emphasisScale : 1));
  setFont('display', size);
  g.textBaseline = 'middle';
  g.fillStyle = s.emph ? C.accent : C.ink;
  const outA = M.clamp((s.textOut - t) / TK.motion.textOut);
  const lh = size * 1.25;
  const y0 = L.keywordY - (s.anchor.length - 1) * lh / 2;
  let idx = 0;
  s.anchor.forEach((line, li) => {
    const chars = [...line];
    const widths = chars.map(c => g.measureText(c).width + size * 0.02);
    const total = widths.reduce((a, b) => a + b, 0);
    let x = L.keywordAlign === 'center' ? W / 2 - total / 2 : L.keywordX;
    chars.forEach((c, ci) => {
      const tt = t - s.textIn - (REDUCED ? 0 : idx * TK.motion.stagger);
      const e = REDUCED ? M.clamp(tt / 0.25) : M.spring(tt, TK.spring.type.k, TK.spring.type.d);
      g.globalAlpha = M.clamp(e) * outA;
      const dy = REDUCED ? 0 : (1 - e) * size * 0.25;
      g.textAlign = 'left';
      g.fillText(c, x, y0 + li * lh + dy);
      x += widths[ci]; idx++;
    });
  });
  g.globalAlpha = 1;
}

// 字幕: 下端の帯（地色 85%）の上に、歌詞の全文。最大2行
function wrapCaption(text, maxW) {
  const out = []; let cur = '';
  for (const ch of [...text]) {
    if (g.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch.trim() ? ch : ''; }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function drawCaption(t, s) {
  if (s.kind !== 'line') return;
  setFont('text', L.caption);
  let rows = [];
  for (const part of s.caption) rows = rows.concat(wrapCaption(part, W - 2 * L.margin));
  if (rows.length > TK.type.maxLines) rows = [rows.slice(0, -1).join(''), rows[rows.length - 1]];
  const lh = L.caption * 1.3;
  // 帯は行数に合わせて広げる（はみ出さない）。下に安全な余白を残す
  const pad = L.caption * 0.6;
  const bh = Math.max(L.captionBandH, rows.length * lh + pad * 2);
  g.globalAlpha = 0.85; g.fillStyle = C.ground; g.fillRect(0, H - bh, W, bh); g.globalAlpha = 1;
  g.fillStyle = C.muted; g.textAlign = 'center'; g.textBaseline = 'middle';
  rows.forEach((r, i) => g.fillText(r, W / 2, H - bh / 2 + (i - (rows.length - 1) / 2) * lh));
}

// ---------- 1フレーム ----------
function draw(t) {
  // フレーム間で状態を持ち越さない（文字揃え・基準線・透明度などを毎回初期化）
  if (g.reset) g.reset();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = C.ground; g.fillRect(0, 0, W, H);
  drawWorld(t);
  const s = sceneAt(t);
  drawKeyword(t, s);
  drawCaption(t, s);
}
window.seek = (t) => { draw(t); return true; };
window.frameInfo = () => ({ W, H, duration: TL.duration, missing: TL.missing });
// 検査用: カメラの値と場面（critique.mjs が使う）
window.cameraAt = (t) => camera(t).concat([chorusAmount(t)]);
// 平均輝度（点滅チェック用）: 縮小して読む
window.frameLuma = () => {
  const s = document.createElement('canvas'); s.width = 64; s.height = 36;
  const sg = s.getContext('2d'); sg.drawImage(cv, 0, 0, 64, 36);
  const d = sg.getImageData(0, 0, 64, 36).data; let sum = 0;
  for (let i = 0; i < d.length; i += 4) sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  return sum / (d.length / 4) / 255;
};

// 普通のブラウザで開いたときだけプレビュー再生（レンダー時は止める）
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
